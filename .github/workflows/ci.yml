name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests evaluation
      - name: Test
        run: pytest
