[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-knowledge-intelligence-agent"
version = "0.1.0"
description = "A citation-grounded enterprise knowledge RAG agent built with FastAPI, LangGraph, Groq, and FAISS."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.5,<3.0",
  "python-multipart>=0.0.9",
  "langgraph>=0.2.50,<1.0",
  "langchain-core>=0.3.20,<2.0",
  "langchain-text-splitters>=0.3.2,<2.0",
  "langchain-groq>=0.2.1,<1.0",
  "langchain-community>=0.3.8,<1.0",
  "langchain-huggingface>=0.1.2,<1.0",
  "sentence-transformers>=3.3,<6.0",
  "faiss-cpu>=1.9,<2.0",
  "pypdf>=5.1,<7.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27", "ruff>=0.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"


[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["B008"]

